<!DOCTYPE html>
<html lang="ko">

<head>
    
    <meta charset="UTF-8">

    <title>subway-congestion-dashboard</title>

    <link rel="stylesheet" href="./index.css?v=9">
    
</head>

<body>

    <div class="container">

        <header class="header">
            
            <h1>지하철 혼잡도</h1>
            
        </header>

        <div class="selection-info" aria-live="polite">
            1호선 · 상선 · 평일 · 06:00
        </div>

        <!-- 메인 -->
        <main class="main">

            <!-- 왼쪽 패널, 호선 선택 -->
            <div class="line-selector">

                <button class="line-btn active" data-line="1">1</button>
                <button class="line-btn" data-line="2">2</button>
                <button class="line-btn" data-line="3">3</button>
                <button class="line-btn" data-line="4">4</button>
                <button class="line-btn" data-line="5">5</button>
                <button class="line-btn" data-line="6">6</button>
                <button class="line-btn" data-line="7">7</button>
                <button class="line-btn" data-line="8">8</button>

            </div>

            <!-- 중앙 -->
            <div class="center-area">

                <div class="station-map"></div>

            </div>

            <!-- 오른쪽 패널 -->
            <div class="right-panel">

                <!-- 방향 선택 -->
                <div class="toggle-box direction-box">

                    <div class="toggle-row" id="direction-selector">

                        <button class="toggle-btn active" data-direction="상선">
                            상선
                        </button>

                        <button class="toggle-btn" data-direction="하선">
                            하선
                        </button>

                    </div>

                </div>

                <!-- 요일 선택 -->
                <div class="toggle-box day-box">

                    <div class="toggle-row" id="day-selector">

                        <button class="toggle-btn active" data-daytype="평일">
                            평일
                        </button>

                        <button class="toggle-btn" data-daytype="토요일">
                            토요일
                        </button>

                        <button class="toggle-btn" data-daytype="일요일">
                            일요일
                        </button>

                    </div>

                </div>

                <!-- 시간 선택 -->
                <div class="time-picker">
                    
                    <div class="time-item" id="prevTime"></div>    <!-- 이전 시간 -->

                    <div class="time-item selected" id="currentTime"></div>    <!-- 선택된 시간 -->

                    <div class="time-item" id="nextTime"></div>    <!-- 이후 시간 -->

                </div>

            </div>

        </main>

        <!-- 혼잡도 범례 -->
        <div class="legend">

            <div class="legend-item">
                <span class="dot green"></span>
                원활
            </div>

            <div class="legend-item">
                <span class="dot yellow"></span>
                보통
            </div>

            <div class="legend-item">
                <span class="dot pink"></span>
                혼잡
            </div>

            <div class="legend-item">
                <span class="dot red"></span>
                매우 혼잡
            </div>

        </div>

    </div>

<script src="./index.js?v=13"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const {
            DataManager,
            MapRenderer,
            ModalManager,
            UIManager,
        } = window.SubwayDashboard;

        const dataManager = new DataManager();
        const modalManager = new ModalManager();
        const uiManager = new UIManager({ dataManager, modalManager });
        const selectionInfo = document.querySelector(".selection-info");
        const updateSelectionInfo = () => {
            const time = String(uiManager.time).padStart(4, "0");
            selectionInfo.textContent = [
                `${uiManager.line}호선`,
                uiManager.direction,
                uiManager.day_type,
                `${time.slice(0, 2)}:${time.slice(2)}`,
            ].join(" · ");
        };
        const mapRenderer = new MapRenderer({
            container: ".station-map",
            dataManager,
            onStationClick: (station) => uiManager.click_station(station),
        });
        uiManager.mapRenderer = mapRenderer;

        document.querySelectorAll(".line-btn").forEach((button) => {
            button.addEventListener("click", () => {
                uiManager.toggle_line(button.dataset.line);
                updateSelectionInfo();
                document.querySelectorAll(".line-btn").forEach((item) => {
                    item.classList.toggle("active", item === button);
                });
            });
        });

        document.querySelectorAll("[data-direction]").forEach((button) => {
            button.addEventListener("click", () => {
                uiManager.toggle_direction(button.dataset.direction);
                updateSelectionInfo();
                document.querySelectorAll("[data-direction]").forEach((item) => {
                    item.classList.toggle("active", item === button);
                });
            });
        });

        document.querySelectorAll("[data-daytype]").forEach((button) => {
            button.addEventListener("click", () => {
                uiManager.toggle_day_type(button.dataset.daytype);
                updateSelectionInfo();
                document.querySelectorAll("[data-daytype]").forEach((item) => {
                    item.classList.toggle("active", item === button);
                });
            });
        });

        const timeItems = ["prevTime", "currentTime", "nextTime"]
            .map((id) => document.getElementById(id));
        let times = [];
        let selectedTimeIndex = 0;
        const renderTimes = () => {
            timeItems.forEach((element, offset) => {
                const timeIndex = (selectedTimeIndex + offset - 1 + times.length)
                    % times.length;
                const time = times[timeIndex];
                element.textContent = `${time.slice(0, 2)}:${time.slice(2)}`;
                element.classList.toggle("selected", offset === 1);
            });
            uiManager.wheelpicker_time(times[selectedTimeIndex]);
            updateSelectionInfo();
        };
        timeItems.forEach((element, offset) => {
            element.addEventListener("click", () => {
                selectedTimeIndex = (selectedTimeIndex + offset - 1 + times.length)
                    % times.length;
                renderTimes();
            });
        });
        document.querySelector(".time-picker").addEventListener("wheel", (event) => {
            event.preventDefault();
            selectedTimeIndex = (selectedTimeIndex + (event.deltaY > 0 ? 1 : -1)
                + times.length) % times.length;
            renderTimes();
        }, { passive: false });
        try {
            await dataManager.load_all();
            times = [...new Set(
                dataManager.congestion_data.data.flatMap((item) => (
                    Object.keys(item)
                        .filter((key) => /^hh\d{2}(?:_mm30)?_aft$/.test(key))
                        .map((key) => key
                            .replace(/^hh/, "")
                            .replace("_mm30_aft", "30")
                            .replace("_aft", "00"))
                )),
            )].sort((a, b) => Number(a) - Number(b));
            selectedTimeIndex = Math.max(
                0,
                times.indexOf("0600"),
            );
            renderTimes();
            uiManager.refresh();
        } catch (error) {
            console.error("대시보드 데이터를 불러오지 못했습니다.", error);
        }
    });
</script>
</body>
</html>
